<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fbfaf7">
<title>{{TITRE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{URL}}">
<link rel="icon" type="image/svg+xml" href="{{RACINE}}{{FAVICON}}">
<link rel="preload" href="{{RACINE}}{{POLICE_TEXTE}}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{RACINE}}{{CSS}}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="VerdierCAM">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="{{TITRE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{CARTE}}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="VerdierCAM">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<a class="saut" href="#contenu">Aller au contenu</a>

<header class="barre">
  <div class="cadre barre-dedans">
    <a class="marque" href="{{RACINE}}" aria-label="VerdierCAM, accueil">
      <img src="{{RACINE}}{{FAVICON}}" alt="" width="30" height="30">
      <span>Verdier<b>CAM</b></span>
    </a>
    <nav class="menu" aria-label="Sections">
      {{NAV}}
    </nav>
    <a class="bouton bouton-plein petit" href="{{RACINE}}#sortie">Être prévenu</a>
  </div>
</header>

<main id="contenu">
{{CORPS}}
</main>

<footer class="pied">
  <div class="cadre pied-dedans">
    <div>
      <a class="marque" href="{{RACINE}}">
        <img src="{{RACINE}}{{FAVICON}}" alt="" width="26" height="26">
        <span>Verdier<b>CAM</b></span>
      </a>
      <p>CAO/FAO pour défonceuse CNC, écrite à
        l'<a href="https://atelierduverdier.fr">Atelier du Verdier</a>.<br>
        © {{ANNEE}} Atelier du Verdier.</p>
    </div>
    <div class="pied-liens">
      {{LIENS}}
    </div>
  </div>
</footer>

<div class="visionneuse" hidden role="dialog" aria-modal="true" aria-label="Capture agrandie">
  <img alt="">
  <button type="button" aria-label="Fermer">×</button>
</div>

<script src="{{RACINE}}{{JS}}" defer></script>
<script>
  window.goatcounter = { path: function (p) { return '{{PREFIXE_COMPTEUR}}' + p } };
</script>
<script data-goatcounter="https://atelierduverdier.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
