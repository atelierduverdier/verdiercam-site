<!-- =========================================================================
     entete.html — haut de page commun de l'Atelier du Verdier
     =========================================================================
     GABARIT DU KIT, recopié dans chaque site par outils/diffuser_kit.py.
     Ne pas l'éditer dans une copie : elle sera écrasée.
     Source : atelierduverdier/site — kit/entete.html

     Marques à remplacer par le générateur — NOMMÉES SANS LEURS ACCOLADES,
     et ce n'est pas une coquetterie : `remplir` fait un remplacement de
     texte sur tout le fichier, commentaire compris. Écrites en toutes
     lettres ici, ces sept marques étaient donc REMPLIES elles aussi, et
     chaque page servait 1 918 octets de commentaire portant son propre
     titre, sa description et ses cinq liens de menu — un bloc de
     documentation qui s'effaçait en expliquant, sur les dix-sept documents
     des quatre sites. Relevé le 29/08/2026.
       TITRE        titre de l'onglet
       DESCRIPTION  méta description (une phrase, pour les moteurs)
       RACINE       préfixe vers le kit depuis la page : "" ou "../"
       SOUS_TITRE   « Atelier Laser », « Journal PrintNC »… vide pour le portail
       NAV          les <a> de navigation
       LOCAL_CSS    <link> vers la feuille propre au site, ou vide

     IMPORTANT — la balise <html> ne porte PAS de data-theme en dur.
     Le site laser écrivait data-theme="light" : comme
     :root[data-theme="light"] est plus spécifique que le bloc
     @media (prefers-color-scheme: dark), un visiteur dont le système est
     en sombre recevait quand même la page blanche (vérifié le 11/08/2026 :
     fond rendu rgb(255,255,255) système en sombre). Son thème sombre
     existait bel et bien — #14171b — mais seul le bouton ◐ y donnait accès.
     ========================================================================= -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- LE CANEVAS AVANT LA FEUILLE DE STYLE. Sans cette ligne, le navigateur
     peint la page en BLANC jusqu'à ce que verdier.css arrive — une seconde
     requête, mesurée à 143 ms au premier appel pour 40 Ko. Sur un poste
     réglé en sombre, ça fait un éclair blanc plein écran à CHAQUE
     navigation. Le script anti-clignotement plus bas ne suffisait pas : il
     pose `data-theme`, ce qui ne dit rien au navigateur sur la couleur du
     fond avant que la feuille ne soit lue. Elle vaut aussi pour l'ascenseur
     et les widgets natifs, qui restaient en livrée claire le long d'une
     page sombre. Déclarée AVANT le <link>, sinon elle arrive trop tard. -->
<meta name="color-scheme" content="light dark">
<title>{{TITRE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="icon" type="image/svg+xml" href="{{RACINE}}chapeau.svg">
<link rel="canonical" href="{{OG_URL}}">

<!-- CE QUE VOIT UN RÉSEAU SOCIAL. Sans ces lignes, Facebook ne trouvait
     ni image ni description : il affichait le domaine, le titre, et un
     cadre vide. Vu par Christophe le 23/08/2026 en partageant la fiche de
     la dust shoe.

     L'image est un JPEG de 1200 x 630 fabriqué par generer.py — PAS le
     WebP servi à la page. Le robot de Facebook ne lit pas le WebP, et
     tout le site est en WebP : c'est le piège qu'il fallait éviter.
     Elle porte l'empreinte de son contenu dans son nom, pour la même
     raison que les captures : Facebook garde longtemps ce qu'il a vu,
     et une adresse qui ne change pas lui ferait ressservir l'ancienne. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Atelier du Verdier">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="{{TITRE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{OG_URL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{OG_ALT}}">
<meta name="twitter:card" content="summary_large_image">

<!-- Anti-clignotement : pose le thème choisi AVANT que la feuille de style
     ne peigne. Placé ici et pas dans verdier.js, qui est chargé en fin de
     page — sinon le visiteur voit le thème clair une fraction de seconde
     avant la bascule. Volontairement minuscule et en ligne. -->
<script>
(function(){try{
  var m=document.cookie.match(/(?:^|;\s*)verdier-theme=(light|dark)/);
  var v=m?m[1]:localStorage.getItem('verdier-theme');
  // `colorScheme` en plus de `data-theme` : la balise <meta> ci-dessus
  // annonce « les deux », donc le navigateur suit l'OS. Quand le visiteur a
  // choisi le CONTRAIRE de son OS, il faut le lui dire ici — sans quoi le
  // fond et l'ascenseur partiraient dans le mauvais sens le temps du
  // chargement, et l'éclair reviendrait pour ceux-là seulement.
  if(v){var r=document.documentElement;r.setAttribute('data-theme',v);
        r.style.colorScheme=v;}
}catch(e){}})();
</script>

<link rel="stylesheet" href="{{RACINE}}verdier.css">
{{LOCAL_CSS}}
</head>
<body>
<a id="top"></a>

<header class="topbar">
  <div class="wrap">
    <!-- Le logo est COLLÉ ici, pas chargé en <img> : en ligne, son
         mot-symbole suit `currentColor`, donc le bouton de thème. En <img>
         il ne suivrait que le réglage du système. -->
    <a class="brand" href="https://atelierduverdier.fr/" aria-label="Atelier du Verdier">
      {{LOGO}}
      <span class="brand-sub">{{SOUS_TITRE}}</span>
    </a>
    <button class="nav-btn" type="button" aria-label="Ouvrir le menu"
            aria-controls="menu-principal">☰</button>
    <nav class="navlinks" id="menu-principal">
      {{NAV}}
    </nav>
    <!-- Le contraste, DESSINÉ et non écrit. Le caractère « ◐ » était rendu
         par la police du système : maigre, minuscule, et lu comme un
         chevron. Le tracé ci-dessous est le même trait que les pictos des
         cartes, et le demi-disque plein dit ce que fait le bouton. -->
    <button class="theme-btn" type="button" title="Thème clair / sombre"
            aria-label="Basculer entre le thème clair et le thème sombre">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="8.6"/>
        <path d="M12 3.4a8.6 8.6 0 0 1 0 17.2Z" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </div>
</header>
