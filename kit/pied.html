<!-- =========================================================================
     pied.html — bas de page commun de l'Atelier du Verdier
     =========================================================================
     GABARIT DU KIT, recopié dans chaque site par outils/diffuser_kit.py.
     Ne pas l'éditer dans une copie : elle sera écrasée.
     Source : atelierduverdier/site — kit/pied.html

     Marques à remplacer par le générateur :
       {{RACINE}}     préfixe vers le kit depuis la page : "" ou "../"
       {{SOUS_TITRE}} nom du site dans la marque du pied
       {{RESUME}}     une ou deux phrases sur ce qu'est ce site-là
       {{LIENS}}      les <a> du pied
       {{ANNEE}}      année du copyright
       {{LOCAL_JS}}   <script> propre au site, ou vide
     ========================================================================= -->

<footer>
  <div class="wrap foot-grid">
    <div>
      <div class="brand" style="margin-bottom:8px">
        {{LOGO}}
        <span class="brand-sub">{{SOUS_TITRE}}</span>
      </div>
      <p class="muted" style="margin:.2em 0 0">
        {{RESUME}}<br>
        © {{ANNEE}} Atelier du Verdier.
      </p>
    </div>
    <div class="foot-links">
      {{LIENS}}
      <a href="#top">Haut de page ↑</a>
    </div>
  </div>
</footer>

<!-- Visionneuse : présente sur toutes les pages, verdier.js ne s'y accroche
     que s'il trouve des images à agrandir. -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image agrandie">
  <button class="lb-close" id="lbClose" type="button" aria-label="Fermer">×</button>
  <img id="lbImg" src="" alt="">
  <div class="lb-hint">Cliquer n'importe où, ou Échap, pour fermer</div>
</div>

<script src="{{RACINE}}verdier.js"></script>
{{LOCAL_JS}}

<!-- Fréquentation : GoatCounter, compte unique pour tout le domaine, donc
     tous les sous-domaines remontent au même endroit. Pas de cookie, pas
     de tiers publicitaire, rien à demander au visiteur.

     LE PRÉFIXE N'EST PAS UN ORNEMENT. Vérifié dans count.js le 12/08/2026 :
     la charge utile envoyée est p (chemin), r, t, e, s, b, q — le NOM D'HÔTE
     n'en fait pas partie. Sans préfixe, le « / » de ce site et le « / » du
     journal PrintNC tomberaient dans le même seau, et les deux courbes
     seraient indémêlables.

     C'est le nouveau venu qui se préfixe, jamais le journal : lui a des
     mois d'historique sur « / », et le couper en deux séries serait perdre
     la continuité qu'on cherche justement à préserver. -->
{{COMPTEUR_PREFIXE}}
<script data-goatcounter="https://atelierduverdier.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

</body>
</html>
